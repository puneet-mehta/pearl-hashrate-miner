[package]
name = "pearl-hashrate-miner"
version = "0.1.0"
edition = "2021"
description = "Standalone Rust miner for the Pearl PoW chain — single static binary, no PyTorch, drives CUDA kernels via cudart directly."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/REPLACE_ME/pearl-hashrate-miner"

[features]
# `cuda` (default) brings in cudarc + the GPU code paths. Disable for
# host-only tools that exercise just the gateway / proof-building code
# (e.g. `cargo run --example probe_pearld --no-default-features`).
default = ["cuda"]
cuda = ["dep:cudarc"]

[dependencies]
cudarc = { version = "0.19", default-features = false, features = ["cuda-12080", "driver", "std", "dynamic-linking"], optional = true }
blake3 = "1.5"
half = "2.4"
thiserror = "1.0"
ureq = { version = "2.10", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"

# Vendored Pearl crates (proof system + Blake3 helpers).
zk-pow = { path = "deps/zk-pow" }
pearl-blake3 = { path = "deps/pearl-blake3" }

# Coinbase tx + block serialization for the gateway.
bitcoin = { version = "0.32", default-features = false, features = ["std", "secp-recovery"] }
bitcoin_hashes = "0.14"
# bech32m for Pearl's custom HRPs (rprl/tprl/mprl); rust-bitcoin's Address
# parser only knows bitcoin HRPs (bc/tb/bcrt), so we decode manually.
bech32 = "0.11"
sha2 = "0.10"
bincode = "1.3"

[[bin]]
name = "pearl-miner"
path = "src/bin/miner.rs"
required-features = ["cuda"]

[[bin]]
name = "pearl-miner-live"
path = "src/bin/live_miner.rs"
required-features = ["cuda"]

[[bin]]
name = "triton-smoke"
path = "src/bin/triton_smoke.rs"
required-features = ["cuda"]

[[bin]]
name = "pearl-bench-breakdown"
path = "src/bin/bench_breakdown.rs"
required-features = ["cuda"]

[lib]
name = "pearl_hashrate_miner"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
