name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: cargo check + clippy + fmt (host-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The full `cuda` feature requires nvcc + libcuda, so CI exercises
      # the host-only build (gateway, proof, parsers). The Docker job
      # below exercises the full CUDA build path.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo check (no-default-features)
        run: cargo check --no-default-features --all-targets

      - name: cargo clippy (no-default-features)
        run: cargo clippy --no-default-features --all-targets

      - name: cargo test (no-default-features)
        run: cargo test --no-default-features --lib
